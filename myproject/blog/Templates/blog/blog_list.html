{% extends "blog/base.html" %}
{% block title %}All Posts{% endblock %}
{% block content %}
    <h1>All Blog Posts ({{ posts|length }})</h1>
    <ul>
        {% for post in posts %}
            <li>{{ post }}</li>
        {% empty %}
            <li>No posts available.</li>
        {% endfor %}
    </ul>
{% endblock %}
