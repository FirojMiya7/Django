{% extends "book/layout.html" %}
{% load static %}

{% block title %}Add Book{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'book/css/book_form.css' %}">
{% endblock %}

{% block content %}

<div class="container">

    <h1>📚 Add New Book</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">
            Add Book
        </button>
    </form>

    <a href="{% url 'book' %}" class="cancel-btn">
        ← Cancel
    </a>

</div>

{% endblock %}
